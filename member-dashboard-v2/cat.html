<script data-purpose="exam-interactions">
    // Interactive selection of answer options
    function selectOption(selectedElement) {
      const allOptions = document.querySelectorAll('.btn-option');
      allOptions.forEach(opt => {
        opt.classList.remove('selected');
      });
      selectedElement.classList.add('selected');
    }

    // Toggle doubtful/ragu-ragu button state
    function toggleRaguRagu() {
      const activeTile = document.querySelector('.tile-active');
      if (activeTile) {
        if (activeTile.classList.contains('tile-flag')) {
          activeTile.classList.remove('tile-flag');
        } else {
          activeTile.classList.add('tile-flag');
        }
      }
    }

    // Mock navigation handler
    function handleNavigation(direction) {
      console.log('Navigate to:', direction);
    }

    // Countdown Timer logic
    let totalSeconds = 1 * 3600 + 29 * 60 + 45;
    const timerElem = document.getElementById('timer-display');

    setInterval(() => {
      if (totalSeconds > 0) {
        totalSeconds--;
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        if (timerElem) {
          timerElem.textContent = `${hours}:${minutes}:${seconds}`;
        }
      }
    }, 1000);
  </script>
