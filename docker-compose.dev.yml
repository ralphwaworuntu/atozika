services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atozika
      POSTGRES_PASSWORD: atozika_secret
      POSTGRES_DB: atozika
    ports:
      - "5434:5432"
    volumes:
      - atozika_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atozika -d atozika"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  atozika_pg:
